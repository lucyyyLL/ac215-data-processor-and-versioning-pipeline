# Green Path collection settings. Storage authentication and mounting are handled by Docker.
storage:
  datasets_prefix: datasets
city:
  name: boston
  prefix: BOS
  bbox: [-71.13, 42.33, -71.03, 42.39]
spatial:
  h3_resolution: 10
  cell_id_template: '{city_prefix}_{h3_index}'
mapillary:
  metadata:
    url_template: https://tiles.mapillary.com/maps/vtp/mly1_public/2/{z}/{x}/{y}
    layer: image
    tile_zoom: 14
  graph_api: https://graph.mapillary.com
  filters:
    min_quality: 0.0
    min_year: 2019
    exclude_months: [12, 1, 2, 3]
    allow_pano: false
    require_heading_for_non_pano: true
  sampling:
    min_images_per_cell: 2
    max_images_per_cell: 4
    quadrant_degrees: 90
    sample_size: 0
    seed: 42
  images:
    download: true
    workers: 8
    thumbnail_field: thumb_1024_url
naip:
  ground_m: 154
  tile_px: 256
  resampling: bilinear
  tile_set_version: v1
  source_snapshot_id: null
  # Legacy identity inputs: retain values to preserve existing Tile Set folder names.
  # These declarations do not implement a snapshot registry or provenance service.
  source_snapshot_definition:
    required_fields: [provider, collection, pinned_release_or_catalog_cutoff, immutable_asset_version_policy]
    moving_latest_is_valid: false
    coverage_in_identity: false
    per_cell_assignments: naip_index
    assignment_inventory_is_append_only: true
    inventory_digest_in_tile_set_hash: false
    inventory_digest_recorded_in_manifest: true
    extension_rule: add_only_new_cells_from_same_pinned_source_contract
    existing_cell_source_change: new_snapshot_identity_and_tile_set
    unavailable_reproducible_release_policy: require_frozen_catalog_and_versioned_assets
  processing_algorithm_version: notebook02_v1
  # Installed library versions participate only in the existing Tile Set hash recipe.
  effective_dependency_versions: null
  tile_set_identity:
    id_template: naip_{ground_m}m_{tile_px}px_{tile_set_version}_{config_hash12}
    hash_prefix_length: 12
    effective_config_fields:
    - spatial.h3_resolution
    - naip.ground_m
    - naip.tile_px
    - naip.resampling
    - naip.tile_set_version
    - naip.source_snapshot_id
    - naip.source_snapshot_definition
    - naip.processing_algorithm_version
    - naip.effective_dependency_versions
    - naip.stac_api
    - naip.collection
    - naip.asset
    - naip.min_year
    - naip.search_end
    - naip.selection
    - naip.tile.bands
    - naip.tile.dtype
    - naip.tile.format
    - naip.tile.encoder_options
    - naip.tile.boundless
    - naip.tile.fill_value
    - naip.tile.nodata_definition
    - naip.tile.max_nodata_fraction
  stac_api: https://planetarycomputer.microsoft.com/api/stac/v1
  collection: naip
  asset: image
  min_year: 2018
  search_end: '2100-01-01'
  search_bbox_pad_degrees: 0.005
  selection:
    coverage_preference: full_approximate_footprint_then_center
    order_descending: [naip_year, item_datetime]
    mosaic: false
  tile:
    bands: [1, 2, 3]
    dtype: uint8
    format: PNG
    encoder_options: {}
    boundless: true
    fill_value: 0
    nodata_definition: rgb_sum_equals_zero
    max_nodata_fraction: 0.05
features:
  processing_version: osm_worldcover_v2
  ground_m: 154
  osm:
    pbf_url: https://download.geofabrik.de/north-america/us/massachusetts-latest.osm.pbf
    snapshot_path: null
    region: massachusetts
    bbox_pad_degrees: 0.004
    network_type: all
    intersection_min_degree: 3
    poi_tags: [amenity, shop, tourism]
    road_classes:
      major: [motorway, motorway_link, trunk, trunk_link, primary, primary_link]
      secondary: [secondary, secondary_link, tertiary, tertiary_link]
      local: [residential, unclassified, living_street, service]
      path: [cycleway, footway, path, pedestrian, track, steps, bridleway]
    bike_tags: [cycleway, 'cycleway:left', 'cycleway:right', 'cycleway:both']
    bike_accepted_values: [lane, opposite_lane, track, opposite_track]
    polygon_filters:
      water:
        natural: [water, wetland]
        waterway: [riverbank, dock]
        landuse: [reservoir, basin]
      green:
        leisure: [park, garden, playground, recreation_ground, nature_reserve, golf_course]
        landuse: [grass, meadow, forest, village_green, recreation_ground, cemetery]
        natural: [wood, scrub, grassland]
      buildings:
        building: true
  worldcover:
    stac_api: https://planetarycomputer.microsoft.com/api/stac/v1
    collection: esa-worldcover
    year: 2021
    product_version: v200
    asset: map
    nodata_value: 0
    classes:
      10: tree
      20: shrub
      30: grass
      40: crop
      50: built
      60: bare
      70: snow
      80: water
      90: wetland
      95: mangrove
      100: moss
outputs:
  mapillary_metadata: raw/mapillary/metadata/tile_z{z}_{x}_{y}.parquet
  streetview_images: raw/mapillary/images/{image_id}.jpg
  osm_pbf: raw/osm/{osm_region}_{osm_snapshot_sha256}.osm.pbf
  osm_download_metadata: raw/osm/{osm_region}_{osm_snapshot_sha256}.osm.pbf.meta.json
  grid: interim/grid.parquet
  cells: interim/cells.parquet
  streetview: interim/streetview.parquet
  naip_images: processed/tiles/{tile_set_id}/{cell_id}.png
  naip_tiles: processed/naip_tiles.parquet
  osm_features: processed/osm_features.parquet
